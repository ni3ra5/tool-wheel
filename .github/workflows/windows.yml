# Builds the Windows app on every change under windows/. Push a tag like windows-v0.1.0 to also publish
# ToolWheel.exe (x64 and ARM64, self-contained, no .NET install needed) to that GitHub Release.
name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
    tags: ["windows-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        run: |
          VERSION=0.0.0
          if [[ "$GITHUB_REF" == refs/tags/windows-v* ]]; then VERSION="${GITHUB_REF_NAME#windows-v}"; fi
          for rid in win-x64 win-arm64; do
            dotnet publish ToolWheel.csproj -c Release -r $rid --self-contained \
              -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$VERSION -o out/$rid
            7z a "ToolWheel-$VERSION-$rid.zip" "./out/$rid/ToolWheel.exe" > /dev/null
          done
          sha256sum *.zip > SHA256SUMS  # the in-app updater checks its download against this
      - uses: actions/upload-artifact@v4
        with:
          name: ToolWheel-windows
          path: |
            windows/*.zip
            windows/SHA256SUMS
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/windows-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "Tool Wheel for Windows ${GITHUB_REF_NAME#windows-}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" *.zip SHA256SUMS --clobber
